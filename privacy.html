<h1>プライバシーポリシー</h1>
<p>本アプリ（Home Calendar Link）は、所有者本人が自宅のHome AssistantでGoogleカレンダーを利用するための個人用アプリです。</p>
<h2>取得する情報</h2>
<p>Googleカレンダーの予定情報のみを取得します。それ以外の情報は取得しません。</p>
<h2>利用目的と保存場所</h2>
<p>取得したデータは、自宅のHome Assistantの中で予定の表示や自動化のためだけに使用します。外部のサーバーには保存しません。</p>
<h2>第三者提供</h2>
<p>取得したデータを第三者に提供・販売することはありません。</p>
